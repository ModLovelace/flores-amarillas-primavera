<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEF9C3" />
    <title>🌻 Feliz Día de la Primavera & Flores Amarillas</title>
    <!-- Inicialización inmediata de favicon y título según parámetro URL para evitar destellos -->
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search);
          var t = p.get('theme');
          var to = p.get('to') || 'Ti';
          var l = document.querySelector("link[rel~='icon']");
          if (t === 'cumpleanos') {
            document.title = 'Cumpleaños para ' + to;
            if (l) l.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎂</text></svg>');
          } else if (t === 'logro-profesional') {
            document.title = 'Logro Profesional para ' + to;
            if (l) l.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎓</text></svg>');
          } else if (t === 'aniversario') {
            document.title = 'Aniversario & Amor para ' + to;
            if (l) l.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💖</text></svg>');
          }
        } catch(e) {}
      })();
    </script>

    <!-- SEO & Social Sharing (WhatsApp / Facebook / Twitter previews) -->
    <meta name="description" content="Un detalle especial para ti en este 21 de septiembre. Que nunca te falten tus flores amarillas ni los motivos para sonreír." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🌻 Flores Amarillas para Ti | Feliz Día de la Primavera" />
    <meta property="og:description" content="Alguien muy especial te ha enviado un ramo de flores amarillas y una carta secreta. ¡Ábrelo!" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Google Fonts: Cormorant Garamond, Caveat, Plus Jakarta Sans, Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cream-100 text-stone-800 antialiased selection:bg-sunflower-300 selection:text-stone-900 min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
